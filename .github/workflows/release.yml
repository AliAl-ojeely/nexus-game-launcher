name: Build and Release Nexus Launcher

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a new GitHub Release after ALL platform builds pass'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Create secrets.json file
        shell: bash
        run: |
          echo "{\"SGDB_API_KEY\":\"${{ secrets.SGDB_API_KEY }}\", \"RAWG_API_KEY\":\"${{ secrets.RAWG_API_KEY }}\", \"YOUTUBE_API_KEY\":\"${{ secrets.YOUTUBE_API_KEY }}\"}" > src/secrets.json

      - name: Set up Python for Windows native helper
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Verify Visual Studio 2022 C++ toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "[NEXUS CI] Windows image: $env:ImageOS ($env:ImageVersion)"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'vswhere.exe not found on runner.' }
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio 2022 C++ x86/x64 tools not found. Use windows-2022.' }
          Write-Host "[NEXUS CI] Visual Studio 2022 C++ toolchain: $vs"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake is not available.' }

      - name: Build native overlay and standalone helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/build_overlay_runtime.ps1

      - name: Verify staged overlay resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/verify_overlay_resources.ps1 -Root build/overlay-runtime

      - name: Smoke-test unpacked Windows app before publishing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --dir --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows unpacked build failed' }
          ./.github/scripts/verify_overlay_resources.ps1 -Root dist/win-unpacked/resources/overlay-runtime -PackagedApp dist/win-unpacked/'Nexus Game Launcher.exe'

      - name: Build Windows installers without publishing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --arm64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }

      - name: Build Linux AppImage without publishing
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --arm64 --publish never

      - name: Build macOS DMG without publishing
        if: runner.os == 'macOS'
        run: |
          npm install --no-save --force @img/sharp-darwin-x64 @img/sharp-libvips-darwin-x64
          npx electron-builder --mac --universal --publish never

      - name: Upload build artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.os }}-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: warn

  publish_release:
    name: Publish release after Windows, Linux and macOS builds pass
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Validate version, lockfile and release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== '2.7.6' || lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('Release version must be 2.7.6 in package.json and both lockfile records');
          }
          NODE
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]]; then
            echo "Tag ${TAG} already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite." >&2
            exit 1
          fi
          test -s ".github/release-notes/${TAG}.md"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "[NEXUS RELEASE] New version ${TAG} is ready for asset validation."

      - name: Download all platform build artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: nexus-*-${{ github.run_number }}
          path: release-input
          merge-multiple: false

      - name: Verify and assemble release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          W="release-input/nexus-windows-2022-${GITHUB_RUN_NUMBER}"
          L="release-input/nexus-ubuntu-latest-${GITHUB_RUN_NUMBER}"
          M="release-input/nexus-macos-latest-${GITHUB_RUN_NUMBER}"
          test -d "$W" && test -d "$L" && test -d "$M"
          mkdir -p release-assets
          cp -- "$W/Nexus Game Launcher Setup ${RELEASE_VERSION}.exe" "release-assets/Nexus-Game-Launcher-Setup-${RELEASE_VERSION}.exe"
          cp -- "$L/Nexus Game Launcher-${RELEASE_VERSION}.AppImage" "release-assets/Nexus-Game-Launcher-${RELEASE_VERSION}.AppImage"
          cp -- "$L/Nexus Game Launcher-${RELEASE_VERSION}-arm64.AppImage" "release-assets/Nexus-Game-Launcher-${RELEASE_VERSION}-arm64.AppImage"
          cp -- "$M/Nexus Game Launcher-${RELEASE_VERSION}-universal.dmg" "release-assets/Nexus-Game-Launcher-${RELEASE_VERSION}-universal.dmg"
          for file in release-assets/*.exe release-assets/*.AppImage release-assets/*.dmg; do
            test -f "$file" || { echo "Missing release asset: $file" >&2; exit 1; }
            bytes="$(stat -c%s "$file")"
            if (( bytes < 20000000 )); then echo "Suspiciously small asset: $file ($bytes bytes)" >&2; exit 1; fi
            echo "[NEXUS RELEASE] Verified $(basename "$file") ($bytes bytes)"
          done
          (cd release-assets && sha256sum *.exe *.AppImage *.dmg > SHA256SUMS.txt)
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5
          cat release-assets/SHA256SUMS.txt

      - name: Publish the validated GitHub Release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nexus Game Launcher ${TAG} - Overlay Installer Hotfix" \
            --notes-file ".github/release-notes/${TAG}.md" \
            --target "$GITHUB_SHA" \
            --fail-on-no-commits \
            --latest
          COUNT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$COUNT" != "5" ]]; then echo "Release assets incomplete: $COUNT / 5" >&2; exit 1; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,isPrerelease,assets
